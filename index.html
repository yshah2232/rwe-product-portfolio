<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1a3e72" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=Merriweather:wght@700&display=swap" rel="stylesheet">

    <title>Clinical Trial Diversity Studio — Search ClinicalTrials.gov in plain language</title>
    <meta name="description" content="Search clinical trials in plain English. Live ClinicalTrials.gov data, AI-rewritten summaries, eligibility checklist, and direct links to recruiting sites." />
    <meta name="author" content="Clinical Trial Diversity Studio" />
    <meta name="keywords" content="clinical trials, ClinicalTrials.gov, plain language clinical trials, find clinical trial, recruiting trials, trial eligibility, patient-friendly clinical trials" />
    <link rel="canonical" href="https://rwe-ctg-new.lovable.app/" />

    <meta property="og:title" content="Clinical Trial Diversity Studio — Search ClinicalTrials.gov in plain language" />
    <meta property="og:description" content="Search clinical trials in plain English. Live ClinicalTrials.gov data, AI-rewritten summaries, eligibility checklist, and direct links to recruiting sites." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://rwe-ctg-new.lovable.app/" />
    <meta property="og:site_name" content="Clinical Trial Diversity Studio" />
    <meta property="og:image" content="https://rwe-ctg-new.lovable.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Clinical Trial Diversity Studio" />
    <meta name="twitter:description" content="Search ClinicalTrials.gov in plain English — AI-rewritten summaries, eligibility checklist, recruiting sites." />
    <meta name="twitter:image" content="https://rwe-ctg-new.lovable.app/og-image.png" />

    <!-- Sitewide JSON-LD: WebSite + SearchAction so Google shows a sitelinks search box -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Clinical Trial Diversity Studio",
      "url": "https://rwe-ctg-new.lovable.app/",
      "description": "Search ClinicalTrials.gov in plain language. AI-rewritten summaries, eligibility checklist, recruiting trial sites.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://rwe-ctg-new.lovable.app/search-registry?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
